services:
  bot:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    group_add:
      - "44"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/bot.sqlite3
    devices:
      - /dev/vcio:/dev/vcio:rwm
    volumes:
      - bot-data:/app/data
      - /sys/class/thermal/thermal_zone0/temp:/host/sys/class/thermal/thermal_zone0/temp:ro
      - /proc/meminfo:/host/proc/meminfo:ro
      - /proc/uptime:/host/proc/uptime:ro
      - /usr/bin/vcgencmd:/usr/bin/vcgencmd:ro

volumes:
  bot-data: